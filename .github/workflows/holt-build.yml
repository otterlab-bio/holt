name: Build and Publish holt-build

on:
  schedule:
    - cron:  '0 6 * * 5'  # 每周五，早上 6 点（UTC 时间）
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'holt-build/**'
      - '.github/workflows/holt-build.yml'
  # Build both architectures on pull requests without publishing, so a broken
  # arm64 base is caught before it reaches holt-run.
  pull_request:
    paths:
      - 'holt-build/**'
      - '.github/workflows/holt-build.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # menci/archlinuxarm covers amd64 (plain Arch) and arm64 (ALARM) from one
      # tag, so the base layer can be published for both architectures.
      - name: Build (linux/amd64, linux/arm64)
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./holt-build
          platforms: linux/amd64,linux/arm64
          # Pull requests build both architectures but never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/otterlab-bio/holt-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build a loadable amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./holt-build
          platforms: linux/amd64
          push: false
          load: true
          tags: holt-build:smoke
          cache-from: type=gha

      - name: Verify amd64 builds a working base
        run: |
          docker run --rm holt-build:smoke \
            sh -c "python --version && R --version && node --version && npm --version && cargo --version && go version && whoami"

      - name: Verify the arm64 base natively on an arm64 runner
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --platform linux/arm64 ghcr.io/otterlab-bio/holt-build:latest \
            sh -c "python --version && R --version && node --version && npm --version && cargo --version && go version && whoami"
