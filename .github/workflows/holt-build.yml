name: Build and Publish holt-build

on:
  schedule:
    - cron:  '0 6 * * 5'  # 每周五，早上 6 点（UTC 时间）
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'holt-build/**'
      - '.github/workflows/holt-build.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./holt-build
          push: true
          tags: ghcr.io/otterlab-bio/holt-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built image
        run: |
          docker run --rm ghcr.io/otterlab-bio/holt-build:latest \
            sh -c "python --version && R --version && node --version && npm --version && cargo --version && go version && whoami"
