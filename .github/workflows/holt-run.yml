name: Build and Publish holt-run

on:
  schedule:
    - cron:  '0 8 * * 5'  # 每周五，早上 8 点（UTC 时间）
  workflow_dispatch:  # 手动触发
  workflow_run:
    workflows: ["Build and Publish holt-build"]
    types:
      - completed
  push:
    branches: [ main ]
    paths:
      - 'holt-run/**'
      - '.github/workflows/holt-run.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./holt-run
          push: true
          tags: ghcr.io/otterlab-bio/holt-run:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built image
        run: |
          docker run --rm ghcr.io/otterlab-bio/holt-run:latest \
            sh -c "otter --version && enva --version && jupyter-lab --version && claude-code --version && whoami"
