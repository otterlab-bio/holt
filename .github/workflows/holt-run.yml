name: Build and Publish holt-run

on:
  workflow_run:
    workflows: ["Build and Publish holt-build"]
    types:
      - completed
  workflow_dispatch:
  # Sent by the OTTER release workflow after a new release is published.
  repository_dispatch:
    types: [ otter-release ]
  # The image follows the newest stable OTTER release, so rebuild weekly even
  # when this repository itself does not change.
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [ main ]
    paths:
      - 'holt-run/**'
      - '.github/workflows/holt-run.yml'
  pull_request:
    paths:
      - 'holt-run/**'
      - '.github/workflows/holt-run.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Test the OTTER installer scripts offline
        run: |
          bash holt-run/tests/install-otter-tools.test.sh
          bash holt-run/tests/resolve-platforms.test.sh

      - name: Check the Dockerfile has no hard-coded OTTER version
        run: |
          if grep -nE '^[[:space:]]*(ENV|ARG)[[:space:]]+OTTER_VERSION=(v?[0-9]|daily-)' holt-run/Dockerfile; then
            echo 'holt-run/Dockerfile must not pin an OTTER version; use --build-arg OTTER_VERSION.' >&2
            exit 1
          fi

      - name: Resolve the OTTER release and the platforms it ships
        id: otter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL --retry 5 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/otterlab-bio/otter/releases/latest" \
            | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          test -n "$tag" || { echo 'could not resolve the latest OTTER release' >&2; exit 1; }
          platforms="$(GITHUB_TOKEN="${GITHUB_TOKEN}" bash holt-run/scripts/resolve-platforms.sh --version "$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Resolved OTTER ${tag} for ${platforms}"

  build:
    needs: test
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          # Native arm64 runner: the holt-run image pulls 2.5 GB of conda
          # packages, which is impractical under QEMU.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      OTTER_REPO: otterlab-bio/otter
      IMAGE: ghcr.io/otterlab-bio/holt-run
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Resolve the OTTER release
        id: otter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL --retry 5 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${OTTER_REPO}/releases/latest" \
            | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          test -n "$tag" || { echo 'could not resolve the latest OTTER release' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # holt-build is private, so authentication is required even on pull
      # requests. Pull requests never push; only pushes/dispatches do.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build this architecture natively
        uses: docker/build-push-action@v6
        with:
          context: ./holt-run
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            OTTER_VERSION=${{ steps.otter.outputs.tag }}
          # Only the registry tag is listed: a bare local name would be
          # pushed to Docker Hub on publish runs.
          tags: |
            ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=holt-run-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=holt-run-${{ matrix.arch }}

      - name: Verify the image natively
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docker tag ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }} holt-run:build
          else
            docker pull ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }}
            docker tag ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }} holt-run:build
          fi
          docker run --rm --platform ${{ matrix.platform }} holt-run:build \
            sh -c "uname -m && otter --version && enva --version && \
                   test \"\$(cat /opt/otter/VERSION)\" = '${{ steps.otter.outputs.tag }}' && \
                   jupyter-lab --version && (claude --version || claude-code --version) && whoami"

      - name: Create otter-core and run the toolchain natively
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docker tag ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }} holt-run:build
          else
            docker pull ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }}
            docker tag ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${{ github.sha }} holt-run:build
          fi
          docker run --rm --platform ${{ matrix.platform }} holt-run:build bash -ec '
            set -e
            prefix=/opt/conda/envs/otter-core
            # The image already initialises otter-core at build time. Rebuild it
            # only when it is missing: enva's --force renames the existing env,
            # which fails on the overlay filesystem ("Cross-device link").
            if [[ ! -f "$prefix/conda-meta/history" ]]; then
              cp /opt/otter/envs/otter-core.yaml /tmp/otter-core.yaml
              enva create --yaml /tmp/otter-core.yaml --name otter-core --clean-cache
            fi
            test -f "$prefix/conda-meta/history"
            run() { enva run otter-core -- "$@"; }
            run samtools --version | head -n 1
            run bismark --version | head -n 1
            run bowtie2 --version | head -n 1
            run STAR --version
            run fastqc --version | head -n 1
            run seqkit version
          '

      - name: Report the per-arch digest
        if: github.event_name != 'pull_request'
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/otterlab-bio/holt-run:${{ matrix.arch }}-${GITHUB_SHA}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.platform }} -> $digest"
          mkdir -p digests
          printf '%s\n' "$digest" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: run-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error

  manifest:
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    env:
      IMAGE: ghcr.io/otterlab-bio/holt-run
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: run-digest-*
          path: digests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the OTTER release for the tag
        id: otter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL --retry 5 --retry-delay 2 \
            -H 'Authorization: Bearer '"${GITHUB_TOKEN}" \
            https://api.github.com/repos/otterlab-bio/otter/releases/latest \
            | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Assemble the multi-arch manifest
        run: |
          amd64="$(cat digests/run-digest-amd64/amd64)"
          arm64="$(cat digests/run-digest-arm64/arm64)"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ steps.otter.outputs.tag }}" \
            "${IMAGE}@${amd64}" \
            "${IMAGE}@${arm64}"

      - name: Verify the published multi-arch manifest
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.otter.outputs.tag }}"

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo '## holt-run'
            echo ''
            echo '| Platform | Runner |'
            echo '| --- | --- |'
            echo '| linux/amd64 | ubuntu-24.04 |'
            echo '| linux/arm64 | ubuntu-24.04-arm |'
            echo ''
            echo "| OTTER release | ${{ steps.otter.outputs.tag || 'unresolved' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
