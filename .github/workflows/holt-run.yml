name: Docker build holt-run

on:
  schedule:
    - cron:  '0 8 * * 5'  # 每周五，早上 8 点（UTC 时间）
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'holt-run/**'
      - '.github/workflows/**'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read  # 仅保留需要的权限
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./holt-run
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/holt-run:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built image
        run: |
          docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/holt-run:latest \
            sh -c "python --version && R --version && jupyter-lab --version && claude-code --version"
